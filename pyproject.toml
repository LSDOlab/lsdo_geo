[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lsdo_geo"
description = "A package for geometry and state modeling/representation, parameterization, and mesh creation for MDO."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{name = "Andrew Fletcher", email = "afletcher168@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    'numpy',
    'pyvista',
    'joblib',
    'pandas',
    'scipy',
    #'csdl_alpha @ git+https://github.com/LSDOlab/CSDL_alpha.git',
    #'lsdo_function_spaces @ git+https://github.com/LSDOlab/lsdo_function_spaces.git'
]
version = "1.0.0"

[project.urls]
Documentation = "https://lsdo-geo.readthedocs.io/en/latest/"
Repository = "https://github.com/afletche/lsdo_geo"
"Issue Tracker" = "https://github.com/afletche/lsdo_geo/issues"

[project.optional-dependencies]
test = [
    'pytest',
    'pytest-cov',
]
docs = [
    'myst-nb',
    'sphinx>=7.0',
    'sphinx_rtd_theme',
    'sphinx-copybutton',
    'sphinx-autoapi>=3.0',
    'numpydoc',
    'gitpython',
    'sphinxcontrib-bibtex',
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["lsdo_geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".conda", ".git", "build", "dist", "examples", "tutorials"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "optimization: marks long-running optimization test cases",
]