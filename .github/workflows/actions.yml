name: Tests

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: | 
        python -m pip install --upgrade pip
        pip install jax networkx
        pip install git+https://github.com/LSDOlab/CSDL_alpha.git@dev_andrew
        pip install git+https://github.com/LSDOlab/lsdo_function_spaces.git
        pip install -e ".[test,docs]"

    - name: Run unit tests
      run: |
        pytest -v tests/

    - name: Verify documentation build
      if: matrix.python-version == '3.11'
      run: |
        sphinx-build -b html docs docs/_build/html -q -W
